[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-robot"
version = "0.1.0"
description = "Local-first custom home robot bridge for Home Assistant (HAOS)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "home-robot contributors" }]
license = { text = "MIT" }
dependencies = [
    "paho-mqtt>=2.1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
home-robot = "home_robot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
